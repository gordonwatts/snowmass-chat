[project]
name = "chathelper"
version = "1.0.0a1"

authors = [{ name = "Gordon Watts", email = "gwatts@uw.edu" }]

description = "Code to build build a chatbot based on PDF documents"
readme = "README.md"
requires-python = ">=3.10"

# keywords = ["one", "two"]
# license = { text = "BSD-3-Clause" }
# classifiers = ["Framework :: Django", "Programming Language :: Python :: 3"]

dependencies = [
    "langchain==0.3.7",
    "langchain-community",
    "langchain-openai",
    "langchain-chroma",
    "PyYAML",
    "pydantic",
    "fsspec[http]",
    "requests",
    "openai",
    # "tiktoken",
    "rich",
    "unstructured[local-inference]",
    "arxiv",
    "pymupdf",
    # "spacy",
    "LightRAG-hku @ git+https://github.com/HKUDS/LightRAG@39cf939d153230c970ae98a9d5b5fbd30340cf3a#egg=LightRAG-HKU",
    "accelerate",
    "aioboto3",
    "graspologic",
    "nano-vectordb",
    "neo4j",
    "networkx",
    "ollama",
    "pyvis",
    "tenacity",
    "torch",
    "transformers",
    "xxhash",
]

[tool.setuptools.packages.find]
include = ["chathelper", "chathelper.fsspec", "chathelper.lc_experimental"]

[project.scripts]
chatter = "chathelper.cli:main"
mk_url_extractor = "chathelper.mk_url_extractor:main"


[project.urls]
Repository = "https://github.com/gordonwatts/snowmass-chat.git"
Homepage = "https://github.com/gordonwatts/snowmass-chat"

[project.optional-dependencies]
test = ["pytest", "black", "flake8"]

[project.entry-points."fsspec.specs"]
inspirehep = "chathelper.fsspec.inspirehep:InspireFileSystem"
arxiv = "chathelper.fsspec.arxiv:ArxivFileSystem"
